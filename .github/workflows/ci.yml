name: dramsys_lib

on: [push, pull_request]

jobs:
  build-dramsys-lib:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Fetch and patch DRAMSys
      run: |
        cd dramsys_lib
        git clone https://github.com/tukl-msd/DRAMSys.git
        cd DRAMSys
        git reset --hard 1ddfb09ae69dd43306b3da59545a747bced8725c
        git apply ../dramsys_lib_patch
    - name: Build DRAMSys
      run: |
        mkdir -p dramsys_lib/DRAMSys/build
        cd dramsys_lib/DRAMSys/build
        cmake -DCMAKE_CXX_FLAGS=-fPIC -DCMAKE_C_FLAGS=-fPIC -D DRAMSYS_USE_DRAMPOWER=ON ..
        make -j

  test-all-drams:
    # Requires a self-hosted runner with a licensed QuestaSim install (`questa`/`vsim` on PATH);
    # GitHub-hosted runners cannot run this.
    runs-on: [self-hosted, questa]
    steps:
    - uses: actions/checkout@v4
    - name: Build DRAMSys
      run: make dramsys
    - name: Run RTL co-simulation for all DRAM models
      run: make test-all-drams
